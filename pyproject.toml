[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adjlint"
version = "0.1.0"
description = "Lint your OHLCV price data: reconstruct corporate actions, catch impossible returns, audit adjustment factors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["linter", "ohlcv", "corporate-actions", "backtesting", "quant", "data-quality", "adjusted-prices"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial Services",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# adjlint has no runtime dependencies on purpose. A data-quality gate that
# itself pulls in a dependency tree is a gate nobody keeps in CI.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adjlint = "adjlint.cli:main"

[project.urls]
Homepage = "https://github.com/3punch/adjlint"
Repository = "https://github.com/3punch/adjlint"
Issues = "https://github.com/3punch/adjlint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adjlint = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PIE", "FURB"]
ignore = [
  # Decimal("1000") over Decimal(1000): a price linter takes numeric input as
  # *text* from CSVs, and spelling every literal as a string is what keeps
  # "never build a money value from a binary float" visible in the code.
  "FURB157",
  # io.py opens a file it hands back to the caller (it must outlive the read),
  # so the context-manager form does not apply at that one site.
  "SIM115",
  # The io layer documents, in comments, the very Persian and Arabic-Indic digits
  # it normalises.  Those glyphs are the subject matter, not a typo.
  "RUF003",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
