name: Publish

# Publishing is driven by a GitHub release, never by a push, so that the release
# notes and the artifact on PyPI are always produced from the same tag.
#
# No API token is stored anywhere: PyPI's Trusted Publishing exchanges this run's
# OIDC identity for a short-lived token. The one-time setup on the PyPI side is in
# docs/RELEASE.md.

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    # PyPI's trusted publisher is scoped to this environment name. Keep it in
    # sync with the "Environment name" field on PyPI.
    environment: pypi
    permissions:
      contents: read
      # Mandatory for Trusted Publishing: without it the runner cannot mint the
      # OIDC token, and PyPI has no way to know who is uploading.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet --upgrade build
          python -m build
      - name: Verify metadata renders on PyPI
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
