name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install --quiet --upgrade ".[dev]"
      - name: Tests
        run: pytest -q
      - name: README contract
        run: |
          adjlint audit --prices examples/prices.csv --actions examples/actions.csv \
            --profile tse --format json --output adjlint-report.json
          python tools/check_readme_contract.py
      - name: Dependency contract
        run: python tools/check_dependency_contract.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet ruff
      - run: ruff check src tests
